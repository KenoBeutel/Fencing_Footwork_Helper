<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
</style>
<title>Fechtschritt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap">
<style>
/* Layout: Plakat-Moderne. Weißer Grund, linksbündiger Textblock in Schwarz/Blau/Rot, flache Waffe als einziges Bild.
   Rot = Glocke und Angriff, Blau = Klinge und Schritt. Bewusst nur ein helles Thema, wie gedrucktes Papier. */
:root{
  --paper:#FFFFFF; --ink:#161616; --grey:#8C8C8C; --rule:#E2E2E2;
  --red:#E3241B; --blue:#1C3DAE;
  --f-serif:"Newsreader","Times New Roman",Times,serif;
  --f-sans:"Hanken Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-sans);font-size:16px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}

.screen{max-width:440px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:30px;padding-block:28px 40px}
.foil{display:block;width:100%;height:auto}
.foil .guard,.foil .grip{fill:var(--red)}
.foil .blade{fill:var(--blue)}

.masthead{display:grid;gap:2px}
.masthead h1{font-family:var(--f-serif);font-weight:400;font-size:2.7rem;line-height:1;letter-spacing:-.01em;margin:0 0 6px}
.masthead .blue{color:var(--blue);font-size:1.45rem;font-weight:500;line-height:1.1}
.masthead .red{color:var(--red);font-size:1.45rem;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums}

.field{display:grid;gap:8px}
.label{font-size:.78rem;font-weight:700;color:var(--ink)}
.seg{display:flex;flex-wrap:wrap;gap:4px 22px}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;padding:6px 0 5px;font-size:1.1rem;color:var(--grey);border-bottom:2px solid transparent}
.seg input:checked + span{color:var(--blue);border-bottom-color:var(--blue)}
.seg input:focus-visible + span{outline:2px solid var(--blue);outline-offset:2px}
.seg input:disabled + span{color:var(--rule);cursor:not-allowed}

.weeks{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:2px 0}
.week{background:none;border:0;padding:6px 0;cursor:pointer;font-size:1.2rem;font-weight:500;color:var(--ink);
  font-variant-numeric:tabular-nums;text-align:left}
.week[aria-checked="true"]{color:var(--red);font-weight:700}
.week:disabled{color:var(--rule);cursor:not-allowed}
.legend{margin:2px 0 0;font-size:.9rem;color:var(--ink)}
.legend b{font-weight:700}
.new{font-size:.72rem;font-weight:700;color:var(--red);margin-left:6px;letter-spacing:.04em}

.start{border:0;border-radius:0;padding:16px 18px;background:var(--red);color:#FFFFFF;cursor:pointer;
  font-size:1.35rem;font-weight:500;text-align:left;display:flex;justify-content:space-between;align-items:center}
.start::after{content:"→"}
.start:hover{background:#C91D15}
.foot{font-size:.72rem;line-height:1.35;color:var(--ink)}

/* Training */
#run{position:fixed;inset:0;background:var(--paper);display:flex;flex-direction:column;justify-content:space-between;gap:16px;
  padding:calc(env(safe-area-inset-top,0px) + 22px) max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 22px) max(20px,env(safe-area-inset-left,0px));
  cursor:pointer;user-select:none;-webkit-user-select:none}
.run-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.time{font-family:var(--f-serif);font-size:2rem;font-variant-numeric:tabular-nums}
.run-week{color:var(--red);font-weight:500}
.mid{display:grid;gap:10px}
.cmd{font-weight:500;line-height:.9;letter-spacing:-.03em;color:var(--blue);
  font-size:clamp(4.5rem,21vw,12rem);transition:color .12s;overflow-wrap:anywhere}
.cmd.hit{color:var(--red)}
.cmd.note{font-family:var(--f-serif);font-weight:400;font-style:italic;color:var(--ink);letter-spacing:0;font-size:clamp(3.2rem,14vw,7.5rem)}
.paused .cmd{color:var(--rule)}
.detail{font-size:1.05rem;min-height:1.5em;color:var(--ink)}

.piste{position:relative;height:40px}
.piste::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--rule)}
.piste::after{content:"";position:absolute;left:0;right:0;top:calc(50% - 6px);height:12px;
  border-left:1px solid var(--ink);border-right:1px solid var(--ink)}
.marker{position:absolute;top:50%;width:150px;transform:translate(-50px,-50%);transition:left .45s ease}
.marker svg{display:block;width:100%;height:auto;transition:transform .18s ease}
.marker.lunge svg{transform:translateX(34px)}
.piste-legend{display:flex;justify-content:space-between;font-size:.72rem;color:var(--grey);margin-top:4px}

.bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.hint{font-size:.9rem;color:var(--grey)}
.stop{background:none;border:0;border-bottom:1px solid var(--ink);padding:4px 0;cursor:pointer;font-weight:500}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<main class="screen" id="setup">
  <svg class="foil" viewBox="0 0 400 60" aria-hidden="true">
    <rect class="grip" x="0" y="26" width="60" height="8"/>
    <path class="guard" d="M60,3 A27,27 0 0 1 60,57 Z"/>
    <path class="blade" d="M84,27.6 L400,29.7 L400,30.3 L84,32.4 Z"/>
  </svg>

  <div class="masthead">
    <h1>Fechtschritt</h1>
    <span class="blue">Fußarbeit für den Fechtkurs</span>
    <span class="red" id="weekBig">Woche 1</span>
  </div>

  <div class="field">
    <span class="label">Kurswoche</span>
    <div class="weeks" id="weeks" role="radiogroup" aria-label="Kurswoche"></div>
    <p class="legend" id="legend"></p>
  </div>

  <div class="field">
    <span class="label">Waffe</span>
    <div class="seg" role="radiogroup" aria-label="Waffe">
      <label><input type="radio" name="waffe" value="ohne" id="w0"><span>Ohne, nur Beine</span></label>
      <label><input type="radio" name="waffe" value="mit" id="w1"><span>Mit, Beine und Arm</span></label>
    </div>
  </div>

  <div class="field">
    <span class="label">Tempo</span>
    <div class="seg" role="radiogroup" aria-label="Tempo">
      <label><input type="radio" name="tempo" value="langsam" id="t1"><span>Langsam</span></label>
      <label><input type="radio" name="tempo" value="mittel" id="t2"><span>Mittel</span></label>
      <label><input type="radio" name="tempo" value="schnell" id="t3"><span>Schnell</span></label>
    </div>
  </div>

  <div class="field">
    <span class="label">Dauer</span>
    <div class="seg" role="radiogroup" aria-label="Dauer">
      <label><input type="radio" name="dauer" value="1" id="d1"><span>1 Min</span></label>
      <label><input type="radio" name="dauer" value="3" id="d3"><span>3 Min</span></label>
      <label><input type="radio" name="dauer" value="5" id="d5"><span>5 Min</span></label>
    </div>
  </div>

  <div class="field">
    <span class="label">Platz</span>
    <div class="seg" role="radiogroup" aria-label="Platz">
      <label><input type="radio" name="platz" value="2" id="p2"><span>2 m</span></label>
      <label><input type="radio" name="platz" value="4" id="p4"><span>4 m</span></label>
      <label><input type="radio" name="platz" value="6" id="p6"><span>6 m</span></label>
    </div>
  </div>

  <button class="start" id="startBtn" type="button">Training starten</button>
  <p class="foot">Platz frei räumen, kurz aufwärmen.<br>Tippen pausiert das Training, Leertaste ebenso.</p>
</main>

<div id="run" hidden>
  <div class="run-top"><span class="time" id="time">0:00</span><span class="run-week" id="runWeek"></span></div>
  <div class="mid"><div class="cmd" id="cmd" aria-live="assertive">3</div><div class="detail" id="detail"></div></div>
  <div>
    <div class="piste" id="piste">
      <div class="marker" id="marker"><svg viewBox="0 0 400 60" aria-hidden="true" class="foil">
        <rect class="grip" x="0" y="26" width="60" height="8"/>
        <path class="guard" d="M60,3 A27,27 0 0 1 60,57 Z"/>
        <path class="blade" d="M84,27.6 L400,29.7 L400,30.3 L84,32.4 Z"/></svg></div>
    </div>
    <div class="piste-legend"><span>hinten</span><span>vorn</span></div>
  </div>
  <div class="bottom">
    <span class="hint" id="hint">Tippen zum Pausieren</span>
    <button class="stop" id="stopBtn" type="button">Beenden</button>
  </div>
</div>

<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s);};
/* Alle Aktionen, die die App kennt. w = wie oft sie relativ vorkommt. */
var ACTIONS={
  vor:{say:"Vor", dx:60, dur:800, w:2},
  zurueck:{say:"Zurück", dx:-60, dur:800, w:2},
  stoss:{say:"Stoß", dx:0, dur:700, hit:true, w:1},
  vorStoss:{say:"Angriff", detail:"Stoß mit Schritt vor", dx:60, dur:1100, hit:true, w:1},
  zurueckStoss:{say:"Konter", detail:"Stoß mit Schritt zurück", dx:-60, dur:1100, hit:true, w:1}
};

/* Kursplan: pro Woche die NEUEN Aktionen plus passende Voreinstellungen.
   Aktionen gelten ab ihrer Woche für alle folgenden Wochen.
   Wochen, die hier fehlen, erscheinen gesperrt. */
var WEEKS = {
  1:{neu:["vor","zurueck"], waffe:"ohne", tempo:"langsam"},
  2:{neu:["vorStoss"], waffe:"mit", tempo:"langsam"}
};
var TOTAL_WEEKS = 15;
var lastWeek = Math.max.apply(null, Object.keys(WEEKS).map(Number));
function weekActions(n){
  var list=[]; for(var i=1;i<=n;i++){ if(WEEKS[i]) list=list.concat(WEEKS[i].neu); } return list;
}

var TEMPO={langsam:{gap:2000,scale:1.3}, mittel:{gap:1100,scale:1.1}, schnell:{gap:500,scale:1}};
var cfg={woche:lastWeek, waffe:"mit", tempo:"langsam", dauer:"3", platz:"4"};
try{ Object.assign(cfg, JSON.parse(localStorage.getItem("fs-min")||"{}")); }catch(e){}
cfg.woche = +cfg.woche; if(!WEEKS[cfg.woche]) cfg.woche = lastWeek;
function save(){ try{ localStorage.setItem("fs-min",JSON.stringify(cfg)); }catch(e){} }
function syncRadios(){
  ["waffe","tempo","dauer","platz"].forEach(function(n){
    var el=document.querySelector('input[name="'+n+'"][value="'+cfg[n]+'"]'); if(el) el.checked=true;
  });
  var hasArm = weekActions(cfg.woche).some(function(k){ return ACTIONS[k].hit; });
  $("#w1").disabled = !hasArm;
  if(!hasArm){ cfg.waffe="ohne"; $("#w0").checked=true; }
}
function renderWeeks(){
  var h="";
  for(var n=1;n<=TOTAL_WEEKS;n++){
    var on = !!WEEKS[n];
    h += '<button type="button" class="week" role="radio" data-week="'+n+'" aria-checked="'+(n===cfg.woche)+'"'+
      (on?'':' disabled title="Noch nicht freigeschaltet"')+' aria-label="Woche '+n+'">'+n+'</button>';
  }
  $("#weeks").innerHTML=h;
}
function activeActions(){
  var list = weekActions(cfg.woche);
  if(cfg.waffe==="ohne") list = list.filter(function(k){ return !ACTIONS[k].hit; });
  return list;
}
function renderLegend(){
  var neu = WEEKS[cfg.woche].neu;
  $("#weekBig").textContent = "Woche "+cfg.woche+" von "+TOTAL_WEEKS;
  $("#legend").innerHTML = activeActions().map(function(k){
    var a=ACTIONS[k];
    return "<b>"+a.say+"</b>"+(a.detail?" = "+a.detail:"")+(neu.indexOf(k)>=0?'<span class="new">neu</span>':"");
  }).join("<br>");
}
$("#weeks").addEventListener("click",function(e){
  var b=e.target.closest("[data-week]"); if(!b || b.disabled) return;
  var n=+b.getAttribute("data-week"), w=WEEKS[n];
  cfg.woche=n; cfg.waffe=w.waffe; cfg.tempo=w.tempo;
  save(); renderWeeks(); syncRadios(); renderLegend();
});
document.addEventListener("change",function(e){
  if(!e.target.name) return; cfg[e.target.name]=e.target.value;
  save(); renderLegend();
});
renderWeeks(); syncRadios(); renderLegend();

var HAS_SPEECH=("speechSynthesis" in window)&&("SpeechSynthesisUtterance" in window);
var voice=null, actx=null;
function pickVoice(){ try{ voice=speechSynthesis.getVoices().filter(function(v){return /^de/i.test(v.lang);})[0]||null; }catch(e){} }
if(HAS_SPEECH){ pickVoice(); try{ speechSynthesis.onvoiceschanged=pickVoice; }catch(e){} }
function beep(f,ms){
  if(!actx) return;
  try{ var o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;
    o.frequency.value=f; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.25,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+ms/1000); o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+ms/1000+0.02);
  }catch(e){}
}
/* Eigene Sounds: Liegt eine Datei unter sounds/<name>.mp3, wird sie statt der Computerstimme abgespielt.
   Fehlt sie, spricht die Browserstimme. */
var SOUND_KEYS={"Vor":"vor","Zurück":"zurueck","Stoß":"stoss","Angriff":"angriff","Konter":"konter","Haltung korrigieren":"haltung","Fertig":"fertig"};
var buffers={}, soundsLoaded=false;
function loadSounds(){
  if(soundsLoaded || !actx || !window.fetch) return; soundsLoaded=true;
  Object.keys(SOUND_KEYS).forEach(function(text){
    var key=SOUND_KEYS[text];
    fetch("sounds/"+key+".mp3").then(function(r){ if(!r.ok) throw 0; return r.arrayBuffer(); })
      .then(function(b){ return new Promise(function(res,rej){ actx.decodeAudioData(b,res,rej); }); })
      .then(function(buf){ buffers[text]=buf; }).catch(function(){});
  });
}
var current=null;
function playBuffer(buf){
  try{ if(current) current.stop(); }catch(e){}
  try{ var s=actx.createBufferSource(); s.buffer=buf; s.connect(actx.destination); s.start(); current=s; return true; }catch(e){ return false; }
}
function say(text,fallbackFreq){
  if(buffers[text] && playBuffer(buffers[text])) return;
  if(HAS_SPEECH){
    try{ speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(text); u.lang="de-DE"; if(voice) u.voice=voice; u.rate=1.05; speechSynthesis.speak(u); return; }catch(e){}
  }
  if(fallbackFreq) beep(fallbackFreq,140);
}

var S={};
function sleep(ms){
  return new Promise(function(res){
    var left=ms, id=setInterval(function(){
      if(S.stopped){clearInterval(id);res();return;}
      if(!S.paused) left-=50;
      if(left<=0){clearInterval(id);res();}
    },50);
  });
}
function showPos(){
  var track=$("#piste").clientWidth, m=$("#marker");
  var x = 50 + (S.pos/S.space)*(track-150);
  m.style.left = x+"px";
}
function lunge(){ var m=$("#marker"); m.classList.add("lunge"); setTimeout(function(){ m.classList.remove("lunge"); },450); }
function fmt(s){ s=Math.max(0,Math.ceil(s)); return Math.floor(s/60)+":"+("0"+(s%60)).slice(-2); }
/* Verhältnis Schritte zu Angriffen:
   nach einem Angriff mindestens 2 Schritte, spätestens nach 4 Schritten kommt wieder einer,
   dazwischen mit 35 % Wahrscheinlichkeit. Ergibt etwa jede 3. bis 4. Ansage einen Angriff. */
var ATTACK_MIN_GAP=2, ATTACK_MAX_GAP=4, ATTACK_CHANCE=0.35;
function fitsSpace(k){ var q=S.pos+ACTIONS[k].dx; return q>=0 && q<=S.space; }
function randomOf(list){ return list[Math.floor(Math.random()*list.length)]; }
function pick(){
  var all=activeActions();
  var steps=all.filter(function(k){ return !ACTIONS[k].hit && fitsSpace(k); });
  var hits=all.filter(function(k){ return ACTIONS[k].hit && fitsSpace(k); });
  var wantHit = hits.length && S.sinceHit>=ATTACK_MIN_GAP &&
    (S.sinceHit>=ATTACK_MAX_GAP || Math.random()<ATTACK_CHANCE);
  if(wantHit || !steps.length && hits.length) return randomOf(hits);
  if(!steps.length) return S.pos > S.space/2 ? "zurueck" : "vor";
  if(S.last && S.last===S.last2){
    var other=steps.filter(function(o){ return o!==S.last; });
    if(other.length) steps=other;
  }
  return randomOf(steps);
}

/* Haltungshinweis alle 30 s Trainingszeit, danach 1,5 s zusätzliche Pause */
var POSTURE_EVERY=30, POSTURE_EXTRA=1500;

async function run(){
  try{ var C=window.AudioContext||window.webkitAudioContext; if(C&&!actx) actx=new C(); if(actx&&actx.state==="suspended") actx.resume(); }catch(e){}
  loadSounds();
  if(HAS_SPEECH){ try{ var u=new SpeechSynthesisUtterance(" "); u.volume=0; speechSynthesis.speak(u); }catch(e){} }
  var wl=null; try{ if(navigator.wakeLock) navigator.wakeLock.request("screen").then(function(w){wl=w;}).catch(function(){}); }catch(e){}
  var t=TEMPO[cfg.tempo];
  S={stopped:false, paused:false, elapsed:0, total:+cfg.dauer*60, space:+cfg.platz*100, pos:+cfg.platz*50, last:null, last2:null, sinceHit:0, nextPosture:POSTURE_EVERY};
  $("#setup").hidden=true; $("#run").hidden=false; $("#run").classList.remove("paused");
  $("#time").textContent=fmt(S.total); $("#hint").textContent="Fechtstellung einnehmen";
  $("#detail").textContent=""; $("#cmd").classList.remove("hit","note");
  $("#runWeek").textContent="Woche "+cfg.woche; showPos();
  for(var n=3;n>=1;n--){ if(S.stopped) return end(wl); $("#cmd").textContent=n; beep(620,100); await sleep(1000); }
  $("#hint").textContent="Tippen zum Pausieren";
  var lastT=performance.now();
  S.tick=setInterval(function(){ var now=performance.now(); if(!S.paused) S.elapsed+=(now-lastT)/1000; lastT=now; $("#time").textContent=fmt(S.total-S.elapsed); },200);
  while(!S.stopped && S.elapsed<S.total){
    var c=$("#cmd");
    if(S.elapsed>=S.nextPosture && S.total-S.elapsed>5){
      S.nextPosture+=POSTURE_EVERY;
      c.textContent="Haltung"; c.classList.remove("hit"); c.classList.add("note");
      $("#detail").textContent="Knie beugen · Schultern locker";
      say("Haltung korrigieren",660);
      await sleep(t.gap+POSTURE_EXTRA);
      c.classList.remove("note");
      continue;
    }
    var k=pick(), a=ACTIONS[k];
    S.last2=S.last; S.last=k;
    S.sinceHit = a.hit ? 0 : S.sinceHit+1;
    c.textContent=a.say; c.classList.toggle("hit",!!a.hit);
    $("#detail").textContent=a.detail||"";
    say(a.say, k==="stoss"?1180:k==="vorStoss"?1400:k==="zurueckStoss"?780:a.dx>0?1040:520);
    if(a.hit) lunge();
    S.pos+=a.dx; showPos();
    await sleep(a.dur*t.scale);
    await sleep(t.gap);
  }
  if(!S.stopped){ $("#cmd").textContent="Fertig"; $("#cmd").classList.remove("hit","note"); $("#detail").textContent=""; say("Fertig",880); await new Promise(function(r){setTimeout(r,1500);}); }
  end(wl);
}
function end(wl){
  S.stopped=true; clearInterval(S.tick);
  try{ if(wl) wl.release(); }catch(e){}
  try{ if(HAS_SPEECH) speechSynthesis.cancel(); }catch(e){}
  $("#run").hidden=true; $("#setup").hidden=false; $("#startBtn").focus();
}
function togglePause(){
  if(S.stopped || $("#run").hidden) return;
  S.paused=!S.paused;
  $("#run").classList.toggle("paused",S.paused);
  $("#hint").textContent=S.paused?"Pausiert · tippen zum Weitermachen":"Tippen zum Pausieren";
  if(S.paused){ try{ speechSynthesis.cancel(); }catch(e){} }
}
$("#startBtn").addEventListener("click",run);
$("#stopBtn").addEventListener("click",function(e){ e.stopPropagation(); S.stopped=true; });
$("#run").addEventListener("click",togglePause);
document.addEventListener("keydown",function(e){ if(e.code==="Space" && !$("#run").hidden){ e.preventDefault(); togglePause(); } });
})();
</script>

</body>
</html>
